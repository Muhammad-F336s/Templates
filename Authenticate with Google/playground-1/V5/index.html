<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Portal - Entry</title>
  <!-- Google Fonts: Montserrat for modern scandinavian feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Subtle Ambient Glow -->
  <div class="ambient-glow"></div>

  <!-- Main Container -->
  <div class="container" id="container">
    
    <!-- Sign Up Form Container -->
    <div class="form-container sign-up-container">
      <form action="#" id="signup-form">
        <h1 class="title">Register</h1>
        <p class="subtitle">Join our collaborative network</p>

        <!-- Social Auth -->
        <div class="social-container">
          <button type="button" class="social-btn" aria-label="Sign up with Google">
            <svg class="social-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          </button>
          <button type="button" class="social-btn" aria-label="Sign up with GitHub">
            <svg class="social-icon" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#1e293b"/></svg>
          </button>
        </div>
        <span class="social-divider">or</span>

        <!-- Input Group: Name -->
        <div class="input-field">
          <input type="text" placeholder="Full name" required />
        </div>

        <!-- Input Group: Email -->
        <div class="input-field">
          <input type="email" placeholder="Email address" required />
        </div>

        <!-- Input Group: Password -->
        <div class="input-field password-field">
          <input type="password" placeholder="Password" class="password-input" required />
          <button type="button" class="password-toggle" aria-label="Toggle Password">show</button>
        </div>

        <button type="submit" class="btn btn-main">Create Account</button>
        
        <!-- Responsive helper switch -->
        <p class="mobile-helper-text">Have an account? <button type="button" class="mobile-switch-btn" id="mobile-to-signin">Sign In</button></p>
      </form>
    </div>

    <!-- Sign In Form Container -->
    <div class="form-container sign-in-container">
      <form action="#" id="signin-form">
        <h1 class="title">Sign In</h1>
        <p class="subtitle">Enter your registered email and password</p>

        <!-- Social Auth -->
        <div class="social-container">
          <button type="button" class="social-btn" aria-label="Sign in with Google">
            <svg class="social-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.85z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          </button>
          <button type="button" class="social-btn" aria-label="Sign in with GitHub">
            <svg class="social-icon" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="#1e293b"/></svg>
          </button>
        </div>
        <span class="social-divider">or</span>

        <!-- Input Group: Email -->
        <div class="input-field">
          <input type="email" placeholder="Email address" required />
        </div>

        <!-- Input Group: Password -->
        <div class="input-field password-field">
          <input type="password" placeholder="Password" class="password-input" required />
          <button type="button" class="password-toggle" aria-label="Toggle Password">show</button>
        </div>

        <a href="#" class="forgot-password">Forgot password?</a>

        <button type="submit" class="btn btn-main">Sign In</button>
        
        <!-- Responsive helper switch -->
        <p class="mobile-helper-text">New here? <button type="button" class="mobile-switch-btn" id="mobile-to-signup">Sign Up</button></p>
      </form>
    </div>

    <!-- Sliding Overlay Panels -->
    <div class="overlay-container">
      <div class="overlay">
        <!-- Left Overlay Panel (shows when SignUp active, to trigger SignIn) -->
        <div class="overlay-panel overlay-left">
          <h2 class="overlay-title">Welcome Back</h2>
          <p class="overlay-desc">Access your workspace using your stored security keys.</p>
          <button class="btn btn-ghost" id="signIn">Sign In</button>
        </div>
        <!-- Right Overlay Panel (shows when SignIn active, to trigger SignUp) -->
        <div class="overlay-panel overlay-right">
          <h2 class="overlay-title">Get Started</h2>
          <p class="overlay-desc">Create a profile to sync data across all your active nodes.</p>
          <button class="btn btn-ghost" id="signUp">Sign Up</button>
        </div>
      </div>
    </div>

  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
